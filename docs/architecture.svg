<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <title>claude-sessions-web components</title>
  <style>
    .bg{fill:#ffffff}
    .box{fill:#f6f5f1;stroke:#c9c7bf;stroke-width:1.2}
    .group{fill:none;stroke:#9a988f;stroke-width:1.2;stroke-dasharray:6 4}
    .main{fill:#fbefe9;stroke:#c96442;stroke-width:1.4}
    .t{fill:#1d1d1b;font-size:14px;font-weight:600}
    .s{fill:#55554f;font-size:12px}
    .m{fill:#55554f;font-size:11.5px;font-family:ui-monospace,Consolas,monospace}
    .g{fill:#77776f;font-size:12px;font-weight:600}
    .a{stroke:#c96442;stroke-width:1.6;fill:none}
    .al{fill:#c96442;font-size:11.5px}
    .head{fill:#c96442}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1b1b19}
      .box{fill:#262624;stroke:#4a4a45}
      .main{fill:#33241e;stroke:#e08a6a}
      .group{stroke:#77776f}
      .t{fill:#ecebe6}.s,.m{fill:#b3b2ab}.g{fill:#9a998f}
      .a{stroke:#e08a6a}.al,.head{fill:#e08a6a}
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="head"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="600"/>

  <!-- browser -->
  <rect class="box" x="20" y="60" width="180" height="80" rx="8"/>
  <text class="t" x="34" y="88">Browser</text>
  <text class="s" x="34" y="108">any device that can reach</text>
  <text class="m" x="34" y="126">--host : --port</text>

  <!-- the server -->
  <rect class="group" x="240" y="20" width="420" height="322" rx="10"/>
  <text class="g" x="256" y="42">claude_sessions_web.py · python3 stdlib, one process</text>

  <rect class="main" x="260" y="56" width="380" height="76" rx="8"/>
  <text class="t" x="274" y="80">HTTP server</text>
  <text class="s" x="274" y="99">the page + a JSON API; listens on --host only</text>
  <text class="s" x="274" y="117">changes need a JSON POST + header + Host check</text>

  <rect class="main" x="260" y="146" width="380" height="76" rx="8"/>
  <text class="t" x="274" y="170">Actions</text>
  <text class="s" x="274" y="189">start · stop · restart · keep running · startup flag</text>
  <text class="s" x="274" y="207">rename · group · archive · restore · bulk</text>

  <rect class="main" x="260" y="236" width="380" height="94" rx="8"/>
  <text class="t" x="274" y="260">Search</text>
  <text class="s" x="274" y="279">index: user + assistant text per conversation</text>
  <text class="s" x="274" y="297">incremental (new bytes only), in --cache-dir</text>
  <text class="s" x="274" y="315">words · "exact phrase" · /regex/</text>

  <!-- files -->
  <rect class="box" x="700" y="56" width="240" height="120" rx="8"/>
  <text class="t" x="714" y="80">Session settings</text>
  <text class="m" x="714" y="100">--sessions-dir</text>
  <text class="m" x="714" y="118">&lt;name&gt;.env  .sid  .prompt</text>
  <text class="m" x="714" y="136">deleted/&lt;name&gt;-&lt;time&gt;/</text>
  <text class="s" x="714" y="158">.env: name, group, args, flags</text>

  <rect class="box" x="700" y="236" width="240" height="94" rx="8"/>
  <text class="t" x="714" y="260">Transcripts</text>
  <text class="m" x="714" y="280">--projects-dir</text>
  <text class="m" x="714" y="298">&lt;cwd&gt;/&lt;conversation&gt;.jsonl</text>
  <text class="s" x="714" y="317">written by Claude Code</text>

  <!-- systemd -->
  <rect class="group" x="240" y="390" width="420" height="190" rx="10"/>
  <text class="g" x="256" y="412">systemd --user (lingering user)</text>

  <rect class="box" x="260" y="424" width="180" height="66" rx="8"/>
  <text class="t" x="274" y="448">claude@&lt;name&gt;</text>
  <text class="s" x="274" y="468">one unit per session;</text>
  <text class="s" x="274" y="483">enabled: starts at boot</text>

  <rect class="box" x="460" y="424" width="180" height="66" rx="8"/>
  <text class="t" x="474" y="448">tmux-server</text>
  <text class="s" x="474" y="468">keeps all sessions;</text>
  <text class="s" x="474" y="483">survives unit restarts</text>

  <rect class="box" x="260" y="504" width="380" height="62" rx="8"/>
  <text class="t" x="274" y="527">bin/claude-session &lt;name&gt;</text>
  <text class="s" x="274" y="547">reads .env + .sid, runs claude --resume &lt;id&gt;</text>

  <!-- arrows -->
  <path class="a" d="M200 96 H258" marker-end="url(#arr)"/>
  <text class="al" x="210" y="88">HTTP</text>

  <path class="a" d="M260 184 H222 V456 H258" marker-end="url(#arr)"/>
  <text class="al" x="214" y="372" text-anchor="end">systemctl --user</text>

  <path class="a" d="M640 184 H670 V116 H698" marker-end="url(#arr)"/>
  <text class="al" x="676" y="204">edit / move</text>

  <path class="a" d="M698 283 H642" marker-end="url(#arr)"/>
  <text class="al" x="650" y="275">reads</text>

  <path class="a" d="M640 535 H820 V332" marker-end="url(#arr)"/>
  <text class="al" x="700" y="527">claude writes</text>

  <path class="a" d="M440 457 H458" marker-end="url(#arr)"/>
</svg>
